version: '3.8'

services:
  aegis-core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SOLANA_CLUSTER=devnet
      - POLICY_EVALUATOR_URL=http://policy-evaluator:8080
      - TEE_SIGNER_URL=http://nitro-enclave-signer:8000
    depends_on:
      - policy-evaluator
      - nitro-enclave-signer

  policy-evaluator:
    build:
      context: ./policy-evaluator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MODEL_NAME=TinyLlama/TinyLlama-1.1B-Chat-v1.0

  nitro-enclave-signer:
    build:
      context: ./nitro-enclave-signer
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=info
      - SPQE_ENABLE_JITTER=true
